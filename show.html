<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Jensen is back</title>
<style>
:root{color-scheme:dark;font:16px system-ui}body{margin:0;background:#151618;color:#fafafa;padding:14px}video{display:block;width:100%;max-height:54vh;aspect-ratio:16/9;background:#000}nav{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}button{font:inherit;border:1px solid #606366;border-radius:8px;background:#26282b;color:inherit;padding:8px 12px}button:first-child{background:#d1edaa;color:#172100}p{min-height:1.4em}
</style>
<video controls playsinline aria-label="Jensen comeback scene"></video>
<nav><button data-clip="cold-open">Play cold open</button><button data-clip="stage">Stage</button><button data-clip="locker-room">Locker room</button><button data-clip="wolf">Wolf speech</button></nav>
<label><input type="checkbox" id="auto"> Play the locker room after the stage clip</label>
<p role="status">Connecting to MCPJam…</p>
<script type="module">
const video=document.querySelector("video"), status=document.querySelector("[role=status]");
const pending=new Map();let sequence=0, generation=0, current="",ready=false;
function rpc(method,params){
  const id=++sequence;
  return new Promise((resolve,reject)=>{
    const timeout=setTimeout(()=>{pending.delete(id);reject(Error("MCPJam timed out."))},30000);
    pending.set(id,{resolve,reject,timeout});parent.postMessage({jsonrpc:"2.0",id,method,params},"*");
  });
}
const names={"cold-open":"Cold open",stage:"Jensen is back","locker-room":"Locker room",wolf:"Wolf speech"};
async function tool(name,args){
  const r=await rpc("tools/call",{name,arguments:args});
  if(r.isError)throw Error(r.content?.[0]?.text || "Tool call failed.");
  return r;
}
async function play(clip,emit){
  const turn=++generation;current="";video.pause();status.textContent="Loading "+names[clip]+"…";
  try{
    if(emit)await tool("cue_scene",{scene:clip});
    const result=await tool("load_show_clip",{clip});
    if(turn!==generation)return;
    video.src="data:video/mp4;base64,"+result._meta.video;
    current=clip;status.textContent=names[clip];
    try{await video.play()}catch{status.textContent=names[clip]+" · Press play on the video."}
  }catch(e){if(turn===generation)status.textContent=e.message}
}
addEventListener("message",({source,data})=>{
  if(source!==parent||data?.jsonrpc!=="2.0")return;
  if(pending.has(data.id)){const p=pending.get(data.id);pending.delete(data.id);clearTimeout(p.timeout);
    if(data.error)p.reject(Error(data.error.message));else p.resolve(data.result);return;}
  if(data.method==="ui/notifications/tool-result"){
    const scene=data.params?.structuredContent?.scene;
    if(Object.hasOwn(names,scene))void play(scene,false);
  }
});
document.querySelector("nav").onclick=e=>{const clip=e.target.dataset.clip;if(ready&&clip)void play(clip,clip!=="cold-open")};
video.ontimeupdate=()=>{if(current==="cold-open"&&video.currentTime>=6.25)void play("stage",true)};
video.onended=()=>{if(current==="stage"&&document.querySelector("#auto").checked)void play("locker-room",true)};
try{
 await rpc("ui/initialize",{protocolVersion:"2026-01-26",appInfo:{name:"Jensen comeback show",version:"1.0.0"},appCapabilities:{}});
 parent.postMessage({jsonrpc:"2.0",method:"ui/notifications/initialized",params:{}},"*");
 ready=true;status.textContent="Ready";
}catch(e){status.textContent=e.message}
</script></html>
